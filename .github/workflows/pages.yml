name: Website

# Publishes https://<owner>.github.io/<repo>/ : the download page at the root
# (scripts/build_site.py) and the documentation (mkdocs) under /docs/.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

on:
  push:
    branches: [main, master]
    paths:
      - "website/**"
      - "docs/**"
      - "mkdocs.yml"
      - "presets/**"
      - "assets/**"
      - "core/model_manager.py"
      - "finetune/presets.py"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mkdocs
        run: pip install mkdocs-material

      - name: Build download page
        run: python scripts/build_site.py --out _site

      - name: Build documentation into /docs
        run: mkdocs build --site-dir _site/docs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
