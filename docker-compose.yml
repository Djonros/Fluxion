# Fluxion Web App — local development services
# Usage:  docker compose up -d
# Stop:   docker compose down

services:
  db:
    image: postgres:16-alpine
    container_name: fluxion-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fluxion
      POSTGRES_PASSWORD: fluxion
      POSTGRES_DB: fluxion
    ports:
      - "5432:5432"
    volumes:
      - fluxion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxion -d fluxion"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  fluxion_pgdata:
